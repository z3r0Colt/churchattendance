name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/verify.mjs
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      JAVA_TOOL_OPTIONS: -Xmx512m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:bundles
      - name: Prepare fictional emulator secrets
        run: node -e 'require("fs").writeFileSync("functions/.secret.local", "PRIVATE_RECORD_KEYS=fictional-emulator-only\nRECOVERY_WRAPPING_KEY=fictional-emulator-only\nCOMMUNICATIONS_CONFIG=fictional-emulator-only\nPORTAL_RATE_LIMIT_KEY=fictional-emulator-only\n")'
      - name: Run end-to-end shard
        run: npx firebase emulators:exec --project demo-sycamore --only auth,firestore,functions,storage "node scripts/seed.mjs && node scripts/operator/emulator-smoke.mjs && node scripts/operator/recovery-smoke.mjs && npx playwright test --shard=${{ matrix.shard }}/3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
